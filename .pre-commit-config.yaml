repos:
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.0
    hooks:
      - id: typos
        name: "Check spelling errors"
        description: "Check for spelling errors in files"
        args: []
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        name: "Ruff linter"
        description: "Check for linting errors"
        args: [--fix]
  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.99
    hooks:
      - id: ty
        name: "Ty type checking"
        description: "Ensure no type errors occur"
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-format
        name: "Ruff formatter"
        description: "Format code consistently (indentation, quotes, whitespace)"
  - repo: https://github.com/JanEricNitschke/pymend
    rev: v3.4.0
    hooks:
      - id: pymend
        name: "Check docstrings"
        description: "Make sure that all docstrings are correct"
        pass_filenames: true
        args: []
